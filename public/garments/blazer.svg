<svg width="600" height="800" viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="800" fill="#ffffff"/>
  <!-- Charcoal interview blazer silhouette -->
  <g>
    <!-- Blazer body -->
    <path d="M 190 200 L 410 200 L 430 240 L 450 720 L 150 720 L 170 240 Z"
          fill="#2c3038" stroke="#0a0a0a" stroke-width="2"/>
    <!-- Sleeves -->
    <path d="M 190 240 L 130 260 L 115 700 L 165 710 L 190 240 Z" fill="#2c3038" stroke="#0a0a0a" stroke-width="2"/>
    <path d="M 410 240 L 470 260 L 485 700 L 435 710 L 410 240 Z" fill="#2c3038" stroke="#0a0a0a" stroke-width="2"/>
    <!-- Lapels (sharp peak) -->
    <path d="M 240 200 L 290 320 L 290 200 Z" fill="#363a42" stroke="#0a0a0a" stroke-width="1.5"/>
    <path d="M 360 200 L 310 320 L 310 200 Z" fill="#363a42" stroke="#0a0a0a" stroke-width="1.5"/>
    <!-- Notch -->
    <path d="M 270 240 L 290 280 L 250 250 Z" fill="#1a1e26"/>
    <path d="M 330 240 L 310 280 L 350 250 Z" fill="#1a1e26"/>
    <!-- Center opening -->
    <line x1="300" y1="320" x2="300" y2="720" stroke="#0a0a0a" stroke-width="2"/>
    <!-- Buttons -->
    <circle cx="285" cy="420" r="5" fill="#1a1a1a" stroke="#666" stroke-width="0.5"/>
    <circle cx="285" cy="500" r="5" fill="#1a1a1a" stroke="#666" stroke-width="0.5"/>
    <!-- Pockets -->
    <rect x="170" y="540" width="80" height="6" fill="#0a0a0a"/>
    <rect x="350" y="540" width="80" height="6" fill="#0a0a0a"/>
    <!-- Chest pocket -->
    <rect x="335" y="320" width="50" height="40" fill="none" stroke="#0a0a0a" stroke-width="1"/>
    <!-- Pocket square -->
    <path d="M 345 320 L 355 310 L 365 320 L 375 310 L 375 320 Z" fill="#f5f5f0"/>
    <!-- Texture -->
    <g stroke="#3a3e48" stroke-width="0.4" opacity="0.5">
      <line x1="200" y1="300" x2="220" y2="700"/>
      <line x1="240" y1="300" x2="250" y2="700"/>
      <line x1="360" y1="300" x2="350" y2="700"/>
      <line x1="400" y1="300" x2="390" y2="700"/>
    </g>
  </g>
  <text x="300" y="770" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8e8e93" letter-spacing="2">CHARCOAL BLAZER</text>
</svg>
