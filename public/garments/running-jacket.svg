<svg width="600" height="800" viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="800" fill="#ffffff"/>
  <!-- Trail running jacket silhouette -->
  <g>
    <!-- Jacket body -->
    <path d="M 190 200 L 410 200 L 430 240 L 450 660 L 150 660 L 170 240 Z"
          fill="#1a3a5c" stroke="#0a1a2c" stroke-width="2"/>
    <!-- Sleeves -->
    <path d="M 190 240 L 130 260 L 110 640 L 160 650 L 190 240 Z" fill="#1a3a5c" stroke="#0a1a2c" stroke-width="2"/>
    <path d="M 410 240 L 470 260 L 490 640 L 440 650 L 410 240 Z" fill="#1a3a5c" stroke="#0a1a2c" stroke-width="2"/>
    <!-- Center zip -->
    <line x1="300" y1="220" x2="300" y2="660" stroke="#0a1a2c" stroke-width="2"/>
    <!-- Zipper pull -->
    <rect x="294" y="640" width="12" height="20" fill="#c0c0c0" stroke="#0a1a2c" stroke-width="1"/>
    <!-- Hood -->
    <path d="M 230 200 Q 300 140 370 200 Z" fill="#1a3a5c" stroke="#0a1a2c" stroke-width="2"/>
    <!-- Reflective accents -->
    <rect x="170" y="380" width="20" height="80" fill="#ff6b35" opacity="0.9"/>
    <rect x="410" y="380" width="20" height="80" fill="#ff6b35" opacity="0.9"/>
    <rect x="200" y="600" width="200" height="8" fill="#ff6b35" opacity="0.9"/>
    <!-- Chest pocket -->
    <rect x="220" y="290" width="60" height="60" fill="none" stroke="#0a1a2c" stroke-width="1.5"/>
    <line x1="220" y1="310" x2="280" y2="310" stroke="#0a1a2c" stroke-width="1"/>
    <!-- Vent lines -->
    <g stroke="#0a1a2c" stroke-width="0.8" opacity="0.5">
      <line x1="200" y1="500" x2="210" y2="640"/>
      <line x1="220" y1="500" x2="225" y2="640"/>
      <line x1="380" y1="500" x2="375" y2="640"/>
      <line x1="400" y1="500" x2="395" y2="640"/>
    </g>
  </g>
  <text x="300" y="770" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8e8e93" letter-spacing="2">TRAIL RUNNING JACKET</text>
</svg>
