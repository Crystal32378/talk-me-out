<svg width="600" height="800" viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="800" fill="#ffffff"/>
  <!-- Beige wool coat silhouette -->
  <g>
    <!-- Coat body -->
    <path d="M 180 180 L 420 180 L 440 220 L 460 720 L 140 720 L 160 220 Z"
          fill="#d4c4a8" stroke="#8e7a5a" stroke-width="2"/>
    <!-- Lapels -->
    <path d="M 240 180 L 300 280 L 300 180 Z" fill="#c4b498" stroke="#8e7a5a" stroke-width="1.5"/>
    <path d="M 360 180 L 300 280 L 300 180 Z" fill="#c4b498" stroke="#8e7a5a" stroke-width="1.5"/>
    <!-- Sleeves -->
    <path d="M 180 220 L 130 240 L 120 700 L 170 710 L 180 220 Z" fill="#d4c4a8" stroke="#8e7a5a" stroke-width="2"/>
    <path d="M 420 220 L 470 240 L 480 700 L 430 710 L 420 220 Z" fill="#d4c4a8" stroke="#8e7a5a" stroke-width="2"/>
    <!-- Center seam -->
    <line x1="300" y1="280" x2="300" y2="720" stroke="#8e7a5a" stroke-width="1.5"/>
    <!-- Belt loops / buttons -->
    <circle cx="290" cy="380" r="4" fill="#8e7a5a"/>
    <circle cx="290" cy="460" r="4" fill="#8e7a5a"/>
    <circle cx="290" cy="540" r="4" fill="#8e7a5a"/>
    <circle cx="290" cy="620" r="4" fill="#8e7a5a"/>
    <!-- Collar -->
    <path d="M 240 180 L 280 220 L 300 200 L 320 220 L 360 180 L 320 160 L 280 160 Z"
          fill="#c4b498" stroke="#8e7a5a" stroke-width="1.5"/>
    <!-- Texture lines for wool -->
    <g stroke="#b8a888" stroke-width="0.5" opacity="0.4">
      <line x1="180" y1="280" x2="200" y2="690"/>
      <line x1="220" y1="280" x2="230" y2="690"/>
      <line x1="380" y1="280" x2="370" y2="690"/>
      <line x1="420" y1="280" x2="410" y2="690"/>
    </g>
  </g>
  <text x="300" y="770" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8e8e93" letter-spacing="2">BEIGE WOOL COAT</text>
</svg>
