<svg width="600" height="800" viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="800" fill="#ffffff"/>
  <!-- Designer logo tee silhouette -->
  <g>
    <!-- T-shirt body -->
    <path d="M 200 220 L 240 180 L 360 180 L 400 220 L 460 260 L 430 320 L 400 290 L 400 680 L 200 680 L 200 290 L 170 320 L 140 260 Z"
          fill="#f5f5f0" stroke="#2c2c2e" stroke-width="2.5"/>
    <!-- Collar -->
    <path d="M 240 180 Q 300 220 360 180" fill="none" stroke="#2c2c2e" stroke-width="2.5"/>
    <!-- Designer logo block (oversized, centered) -->
    <rect x="250" y="350" width="100" height="100" fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <text x="300" y="390" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="32" fill="#1a1a1a" letter-spacing="2">M·B</text>
    <text x="300" y="420" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1a1a1a" letter-spacing="3">MAISON BRANCHÉE</text>
    <text x="300" y="438" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#666" letter-spacing="2">EST. 1987 · PARIS</text>
    <!-- Fabric texture (subtle horizontal lines) -->
    <g stroke="#e0e0d8" stroke-width="0.5" opacity="0.6">
      <line x1="200" y1="500" x2="400" y2="500"/>
      <line x1="200" y1="540" x2="400" y2="540"/>
      <line x1="200" y1="580" x2="400" y2="580"/>
      <line x1="200" y1="620" x2="400" y2="620"/>
      <line x1="200" y1="660" x2="400" y2="660"/>
    </g>
    <!-- Sleeve hems -->
    <line x1="140" y1="260" x2="170" y2="320" stroke="#2c2c2e" stroke-width="1.5"/>
    <line x1="460" y1="260" x2="430" y2="320" stroke="#2c2c2e" stroke-width="1.5"/>
  </g>
  <text x="300" y="770" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8e8e93" letter-spacing="2">DESIGNER LOGO TEE</text>
</svg>
